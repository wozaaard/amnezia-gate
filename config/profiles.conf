# RPM-owned immutable root filesystem image used by systemd-nspawn.
ROOTFS_IMAGE=/usr/lib/amnezia-gate/rootfs.squashfs

# Each profile receives a private /30 from this /16. The importer assigns the
# third and fourth octets through NETWORK_SLOT.
NETWORK_PREFIX=10.231

# Both proxies are published to the LAN. Restrict access in LAN_CIDRS.
LISTEN_ADDRESS=0.0.0.0
LAN_CIDRS=192.168.1.0/24

# Mirror exact per-profile ACCEPT rules into an active iptables FORWARD chain.
# Values: auto, none, iptables.
FORWARD_COMPAT=auto

# The importer allocates the first free pair BASE + N.
SOCKS_PORT_BASE=1080
HTTP_PORT_BASE=10080

# A profile-specific resolv.conf is mounted read-only into the volatile rootfs.
# After awg0 starts, DNS traffic follows the VPN default route.
DNS_SERVERS=1.1.1.1,1.0.0.1
